<style>
:root{
  --bg:#f5f3ef; --panel:#fff; --panel2:#faf9f6; --ink:#1d2125; --muted:#6b7078; --faint:#9aa0a6;
  --line:#e7e3dc; --hover:#f2efe8; --accent:#c2410c; --accent-ink:#fff; --accent-weak:#fdeee4;
  --yes:#15803d; --yes-weak:#e3f4e8; --maybe:#b45309; --maybe-weak:#fdf1dc; --no:#b91c1c; --no-weak:#fbe5e5; --none:#b8bcc2;
  --sel:#fff7ed; --shadow:0 8px 30px rgba(30,25,15,.14);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#16181b; --panel:#1f2226; --panel2:#24282d; --ink:#e8e6e3; --muted:#a3a7ad; --faint:#787d84;
  --line:#33373d; --hover:#2a2e33; --accent:#f97316; --accent-ink:#1a1a1a; --accent-weak:#3a2618;
  --yes:#4ade80; --yes-weak:#173322; --maybe:#fbbf24; --maybe-weak:#3a2d12; --no:#f87171; --no-weak:#3b1c1c; --none:#5d636b;
  --sel:#2d241c; --shadow:0 8px 30px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#16181b; --panel:#1f2226; --panel2:#24282d; --ink:#e8e6e3; --muted:#a3a7ad; --faint:#787d84;
  --line:#33373d; --hover:#2a2e33; --accent:#f97316; --accent-ink:#1a1a1a; --accent-weak:#3a2618;
  --yes:#4ade80; --yes-weak:#173322; --maybe:#fbbf24; --maybe-weak:#3a2d12; --no:#f87171; --no-weak:#3b1c1c; --none:#5d636b;
  --sel:#2d241c; --shadow:0 8px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Heebo,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:3px 8px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],input[type=search],input[type=number],select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 9px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted);background:var(--panel2)}

/* header */
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;border-radius:3px;background:var(--accent);display:inline-block}
.tabs{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:10px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:8px;color:var(--muted);font-weight:500}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
#q{width:260px}
.spacer{flex:1}
#saved{font-size:12px;color:var(--faint)}

.app{flex:1;display:flex;min-height:0}
/* sidebar */
aside.side{width:290px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:10px 12px 40px}
.side h4{margin:14px 2px 6px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.views{display:flex;gap:6px}
.views select{flex:1;min-width:0}
.facet{border-bottom:1px solid var(--line)}
.fh{width:100%;display:flex;align-items:center;gap:6px;border:0;background:none;padding:9px 2px;font-weight:600;text-align:right}
.fh .ch{margin-inline-start:auto;color:var(--faint);transition:transform .15s}
.facet.open .fh .ch{transform:rotate(-90deg)}
.fh .badge{background:var(--accent);color:var(--accent-ink);border-radius:10px;font-size:11px;padding:0 7px}
.fb{display:none;padding:0 2px 10px}
.facet.open .fb{display:block}
.fmode{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}
.fmode button{border:1px solid var(--line);background:var(--panel);border-radius:6px;font-size:12px;padding:1px 7px;color:var(--muted)}
.fmode button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
.fsearch{width:100%;margin-bottom:6px;padding:4px 8px!important;font-size:13px}
.fv{display:flex;align-items:center;gap:7px;padding:3px 4px;border-radius:6px;cursor:pointer;font-size:13.5px}
.fv:hover{background:var(--hover)}
.fv input{margin:0;accent-color:var(--accent)}
.fv .l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fv .c{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.fv.zero{opacity:.45}
.fv .dot{width:9px;height:9px;border-radius:50%;flex:none}
.more{border:0;background:none;color:var(--accent);font-size:12.5px;padding:3px 4px}
.range{display:flex;gap:6px;align-items:center}
.rsec{margin-top:14px;border-top:2px solid var(--line)}
.rsec .rbody{display:none;padding-bottom:10px}
.rsec.open .rbody{display:block}
.rsec.open .fh .ch{transform:rotate(-90deg)}
.range input{width:80px}

/* main */
main{flex:1;display:flex;flex-direction:column;min-width:0}
.toolbar{display:flex;align-items:center;gap:8px;padding:10px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--panel2)}
.count{font-weight:600}
.count small{color:var(--muted);font-weight:400}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-weak);color:var(--ink);border-radius:20px;padding:2px 4px 2px 10px;font-size:12.5px}
.chip b{font-weight:600}
.chip button{border:0;background:none;color:var(--muted);padding:0 4px;font-size:14px;line-height:1}
.chip.neg{background:var(--no-weak)}
.bulk{display:none;align-items:center;gap:6px;padding:8px 16px;background:var(--sel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.bulk.on{display:flex}
.bulk .n{font-weight:700;margin-left:6px}
.sbtn.yes{color:var(--yes)} .sbtn.maybe{color:var(--maybe)} .sbtn.no{color:var(--no)}

.view{flex:1;overflow:auto;display:none}
.view.on{display:block}
table{border-collapse:separate;border-spacing:0;width:100%}
thead th{position:sticky;top:0;background:var(--panel);z-index:2;text-align:right;font-weight:600;font-size:12.5px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--ink)}
thead th.sorted{color:var(--accent)}
tbody td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;max-width:240px;background:var(--panel)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
tbody tr.sel td{background:var(--sel)}
tbody tr.cur td{box-shadow:inset 0 0 0 9999px rgba(194,65,12,.06)}
td.cb,th.cb{width:34px;text-align:center;cursor:default}
td.cb input,th.cb input{accent-color:var(--accent);width:15px;height:15px}
td.nm{font-weight:600;min-width:180px}
td .tx{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;border-radius:5px;padding:0 6px;font-size:12px;background:var(--hover);margin:1px 0 1px 3px;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:3px;border-radius:5px;padding:0 7px;font-size:12px;color:#fff;margin:1px 0 1px 3px;white-space:nowrap}
.tag button{border:0;background:none;color:inherit;padding:0 0 0 2px;opacity:.8}
.qs{display:inline-flex;gap:3px}
.qs button{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);font-size:12px;font-weight:700;color:var(--faint);padding:0;display:grid;place-items:center}
.qs button:hover{border-color:var(--muted)}
.qs button.yes.on{background:var(--yes);border-color:var(--yes);color:#fff}
.qs button.maybe.on{background:var(--maybe);border-color:var(--maybe);color:#fff}
.qs button.no.on{background:var(--no);border-color:var(--no);color:#fff}
.lnk{text-decoration:none;margin-left:6px}
.empty{padding:60px;text-align:center;color:var(--muted)}

/* drawer */
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(560px,100vw);background:var(--panel);box-shadow:var(--shadow);transform:translateX(-105%);transition:transform .18s ease;z-index:30;display:flex;flex-direction:column}
#drawer.on{transform:none}
.dh{padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.dh-top{display:flex;align-items:flex-start;gap:8px}
.dh h2{margin:0;font-size:19px;flex:1}
.dh .sub{color:var(--muted);font-size:13px;margin-top:2px}
.dstatus{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.dstatus .btn.on.yes{background:var(--yes);color:#fff;border-color:var(--yes)}
.dstatus .btn.on.maybe{background:var(--maybe);color:#fff;border-color:var(--maybe)}
.dstatus .btn.on.no{background:var(--no);color:#fff;border-color:var(--no)}
.dtags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;align-items:center}
.db{flex:1;overflow:auto;padding:4px 18px 30px}
.grp{margin-top:14px}
.grp>summary{font-weight:700;font-size:13px;color:var(--accent);cursor:pointer;padding:4px 0;list-style:none}
.grp>summary::before{content:"▾ "}
.grp:not([open])>summary::before{content:"▸ "}
.fld{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:start;padding:5px 0}
.fld>label{font-size:12.5px;color:var(--muted);padding-top:6px}
.fld.edited>label{color:var(--accent)}
.fld.edited>label::after{content:" •"}
.fld input[type=text],.fld input[type=number],.fld textarea{width:100%}
.fld textarea{min-height:60px;resize:vertical}
.fwrap{display:flex;gap:6px;align-items:center}
.fwrap input{flex:1}
.reset{border:0;background:none;color:var(--faint);font-size:12px;padding:2px}
.mchips{display:flex;flex-wrap:wrap;gap:4px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:4px;min-height:34px}
.mchips .pill{display:inline-flex;align-items:center;gap:2px;font-size:12.5px;padding:1px 4px 1px 8px}
.mchips .pill button{border:0;background:none;color:var(--muted);padding:0 3px}
.mchips input{border:0!important;flex:1;min-width:90px;padding:3px!important}
.df{padding:10px 18px;border-top:1px solid var(--line);display:flex;gap:8px;font-size:12px;color:var(--muted);align-items:center}
.hide-empty .fld.isempty{display:none}

/* popover / modal / toast */
.pop{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px;min-width:220px;max-height:60vh;overflow:auto}
.pop .it{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer}
.pop .it:hover{background:var(--hover)}
.pop .sw{width:11px;height:11px;border-radius:3px;flex:none}
.pop input[type=text]{width:100%;margin-top:6px}
.pop h5{margin:2px 6px 6px;font-size:12px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:grid;place-items:center}
.modal{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;width:min(520px,94vw);max-height:85vh;overflow:auto}
.modal h3{margin:0 0 12px}
.trow{display:flex;gap:8px;align-items:center;padding:5px 0}
.trow input[type=text]{flex:1}
.trow input[type=color]{width:34px;height:30px;border:0;background:none;padding:0}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 14px;display:flex;gap:12px;align-items:center;z-index:70;transition:transform .2s;font-size:13.5px}
#toast.on{transform:translateX(-50%)}
#toast button{background:none;border:0;color:var(--accent);font-weight:700}

/* dashboard */
.dash{padding:16px;display:flex;flex-direction:column;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.kpi:hover{border-color:var(--muted)}
.kpi .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .k{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px}
.kpi .k i{width:9px;height:9px;border-radius:50%;display:inline-block}
.prog{height:8px;border-radius:5px;overflow:hidden;display:flex;background:var(--hover)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.card h3 small{color:var(--faint);font-weight:400}
.card h3 .x{margin-inline-start:auto;border:0;background:none;color:var(--faint)}
.bar{display:grid;grid-template-columns:minmax(80px,38%) 1fr 38px;gap:8px;align-items:center;padding:2px 4px;border-radius:6px;cursor:pointer;font-size:13px}
.bar:hover{background:var(--hover)}
.bar .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t{height:14px;display:flex;border-radius:3px;overflow:hidden}
.bar .t span{height:100%}
.bar .n{text-align:left;font-variant-numeric:tabular-nums;color:var(--muted)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-left:4px;vertical-align:-1px}
.xt{overflow:auto;max-height:520px}
.xt table td,.xt table th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:center;font-size:12.5px;white-space:nowrap}
.xt table th{position:sticky;top:0;background:var(--panel)}
.xt table th.rh,.xt table td.rh{text-align:right;position:sticky;right:0;background:var(--panel);font-weight:600;z-index:1}
.xt td.c{cursor:pointer;font-variant-numeric:tabular-nums}
.xt td.c:hover{outline:2px solid var(--accent);outline-offset:-2px}
.secth{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.secth h2{margin:0;font-size:16px;margin-left:8px}

/* grouped lists */
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;align-items:start}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gcard h3{margin:0;padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);background:var(--panel2)}
.gcard h3 .n{margin-inline-start:auto;color:var(--muted);font-weight:500}
.gcard ul{list-style:none;margin:0;padding:4px 0;max-height:340px;overflow:auto}
.gcard li{display:flex;gap:7px;align-items:center;padding:4px 12px;cursor:pointer;font-size:13.5px}
.gcard li:hover{background:var(--hover)}
.gcard li .dot{width:8px;height:8px;border-radius:50%;flex:none}
.gcard li .s{color:var(--faint);font-size:12px;margin-inline-start:auto;white-space:nowrap}
.gcard .prog{height:4px;border-radius:0}

#sideToggle{display:none}
@media (max-width:900px){
  #sideToggle{display:inline-flex}
  aside.side{position:fixed;top:0;bottom:0;right:0;z-index:40;transform:translateX(105%);transition:transform .18s;box-shadow:var(--shadow)}
  aside.side.on{transform:none}
  #q{width:100%;order:9}
  .fld{grid-template-columns:1fr}
}
</style>

<body>
<header>
  <div class="brand"><i></i>סינון עסקי תיירות</div>
  <div class="tabs" id="tabs">
    <button data-tab="list" class="on">רשימה</button>
    <button data-tab="dash">פילוח</button>
    <button data-tab="groups">רשימות לפי נושא</button>
  </div>
  <input id="q" type="search" placeholder="חיפוש חופשי (שם, מקום, הערות…)  /">
  <button class="btn" id="sideToggle">מסננים</button>
  <div class="spacer"></div>
  <span id="saved"></span>
  <button class="btn ghost" id="undoBtn" title="ביטול פעולה אחרונה (Ctrl+Z)" disabled>↶ ביטול</button>
  <button class="btn" id="addBtn">+ עסק חדש</button>
  <button class="btn" id="menuBtn">ייצוא וגיבוי ▾</button>
</header>

<div class="app">
  <aside class="side" id="side"></aside>
  <main>
    <div class="toolbar">
      <span class="count" id="count"></span>
      <div class="chips" id="chips"></div>
      <div class="spacer"></div>
      <button class="btn sm" id="selAllBtn">בחר את כל המסוננים</button>
      <button class="btn sm" id="colsBtn">עמודות ▾</button>
    </div>
    <div class="bulk" id="bulk">
      <span class="n" id="bulkN"></span>
      <button class="btn sm sbtn yes" data-bulk="yes">✓ רלוונטי</button>
      <button class="btn sm sbtn maybe" data-bulk="maybe">? לבדיקה</button>
      <button class="btn sm sbtn no" data-bulk="no">✕ לא רלוונטי</button>
      <button class="btn sm" data-bulk="clear">נקה סטטוס</button>
      <button class="btn sm" id="bulkEdit">עריכת שדה ▾</button>
      <button class="btn sm" id="bulkExport">ייצוא הנבחרים</button>
      <div class="spacer"></div>
      <button class="btn sm ghost" id="bulkClear">בטל בחירה ✕</button>
    </div>
    <div class="view on" id="v-list"></div>
    <div class="view" id="v-dash"></div>
    <div class="view" id="v-groups"></div>
  </main>
</div>

<aside id="drawer"></aside>
<div id="toast"><span id="toastMsg"></span><button id="toastUndo">ביטול</button></div>
<input type="file" id="restoreFile" accept=".json" hidden>

<script>
'use strict';
/* ---------------- constants ---------------- */
const LS_KEY = 'negba-tourism-v1';
const EMPTY = '(ריק)';
const STATUS = [
  {k:'yes',   label:'רלוונטי',    icon:'✓', key:'1'},
  {k:'maybe', label:'לבדיקה',     icon:'?', key:'2'},
  {k:'no',    label:'לא רלוונטי', icon:'✕', key:'3'},
];
const NONE_LABEL = 'לא סומן';
const S_LABEL = Object.fromEntries(STATUS.map(s => [s.k, s.label]));
const S_BY_LABEL = Object.fromEntries(STATUS.map(s => [s.label, s.k]));
const S_COLOR = {yes:'var(--yes)', maybe:'var(--maybe)', no:'var(--no)', none:'var(--none)'};
const TAG_COLORS = ['#2563eb','#7c3aed','#0d9488','#db2777','#ea580c','#65a30d','#0891b2','#a16207','#4f46e5','#be123c','#475569','#059669'];
const GROUP_ORDER = ['כללי','קשר','אטרקציות','קולינריה','לינה','מצב עסקי','פרטים נוספים'];
const NAME = 'שם העסק';

/* ---------------- fields ---------------- */
const FIELDS = window.BASE_FIELDS;
const FBY = Object.fromEntries(FIELDS.map(f => [f.key, f]));
const VIRTUAL = {
  __status:  {key:'__status',  label:'סטטוס',  type:'single', virtual:true},
  __subtype: {key:'__subtype', label:'תת-סוג (אטרקציה / מטבח / לינה)', type:'multi', virtual:true},
  __contact: {key:'__contact', label:'פרטי קשר קיימים', type:'multi', virtual:true},
};
const fdef = k => VIRTUAL[k] || FBY[k];
const SUBTYPE_KEYS = FIELDS.filter(f => /סוג האטרקציה|סוג מטבח|סוג אירוח/.test(f.key)).map(f => f.key);
const CONTACT = [
  ['יש טלפון',   r => r['טלפון בעל העסק'] || r['טלפון העסק (ללקוחות)']],
  ['יש מייל',    r => r['מייל בעל העסק']],
  ['יש אתר',     r => r['קישור לדף אינטרנט']],
  ['יש פייסבוק', r => r['קישור לרשת חברתית (Facebook)']],
  ['יש אינסטגרם',r => r['קישור לרשת חברתית (Instagram)']],
  ['יש Booking', r => r['קישור לאתר BOOKING (לינה)']],
  ['יש Google maps', r => r['Google maps']],
];
const FACET_MAIN = ['__status','תחום עיסוק','מגזר','אזור גיאוגרפי','מיקום','רשות','__subtype',
  '(אטרקציות) - סוג האטרקציה','(קולינריה) - סוג מטבח','(לינה) - סוג אירוח','מקום בעל עניין מיוחד לפרויקט',
  '__contact','(קולינריה) - תפריט כשר','פתוח בשבת'];

/* ---------------- state ---------------- */
function loadState(){
  try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (s && s.marks) return s; } catch(e){}
  return null;
}
// localStorage holds UI preferences plus a cache of the shared data for a fast first paint
const S = Object.assign({marks:{}, edits:{}, added:[], deleted:[], tags:[], views:[], ui:{}}, loadState() || {});
S.ui = Object.assign({
  tab:'list', cols:['__status','תחום עיסוק','__subtype','מיקום','אזור גיאוגרפי','מגזר','טלפון בעל העסק','__contact'],
  sort:{k:NAME, dir:1}, filters:{q:'', f:{}, r:{}}, open:{__status:true,'תחום עיסוק':true,'אזור גיאוגרפי':true},
  dashDims:['__status','תחום עיסוק','אזור גיאוגרפי','מגזר','מיקום','(אטרקציות) - סוג האטרקציה','(קולינריה) - סוג מטבח','(לינה) - סוג אירוח'],
  crossA:'מיקום', crossB:'תחום עיסוק', groupDim:'תחום עיסוק', groupBy2:'', autoAdvance:true, hideEmpty:false,
}, S.ui);
// one-time: drop tags from saved columns, dashboard topics and filters
if (!S.ui.noTags2){ S.ui.cols = S.ui.cols.filter(k => k !== '__tags'); S.ui.dashDims = S.ui.dashDims.filter(k => k !== '__tags'); delete S.ui.filters.f.__tags; S.ui.noTags2 = true; }
let FL = S.ui.filters;
const SEL = new Set();
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){}
    pushDirty();
  }, 250);
}

/* ---------------- shared storage (Supabase) ----------------
   Each business that has a status / edits / was added / was deleted is one row.
   Local state is pushed as a diff against what the server last confirmed, so every
   kind of change (single, bulk, undo, restore) syncs the same way. */
const SB_URL = 'https://gaorzjzmxjsdrhwevpuz.supabase.co';
const SB_KEY = 'sb_publishable_jFN9A6lABA6bP6YCyyYs9g_FOBQsgAG';
const TABLE = 'negba_biz_state';
const sb = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY) : null;
let SYNCED = {}, loaded = false, pushing = false, pushAgain = false, retryTimer = null;
const rowFor = id => ({id, status: (S.marks[id] && S.marks[id].s) || null, edits: S.edits[id] || {},
  base: S.added.find(r => r._id === id) || null, deleted: S.deleted.includes(id)});
const rowKey = r => JSON.stringify([r.status || null, r.edits || {}, r.base || null, !!r.deleted]);
const BLANK = rowKey({});
const isDirty = id => rowKey(rowFor(id)) !== (SYNCED[id] || BLANK);
function setSync(state){
  const el = document.getElementById('saved');
  el.textContent = {ok:'✓ מסונכרן עם כולם', saving:'שומר…', loading:'טוען נתונים משותפים…',
    error:'⚠ אין חיבור – השינויים יישמרו כשהחיבור יחזור', local:'⚠ מצב מקומי בלבד'}[state];
  el.style.color = state === 'error' || state === 'local' ? 'var(--no)' : '';
}
async function pushDirty(){
  if (!sb || !loaded) return;
  if (pushing){ pushAgain = true; return; }
  pushing = true;
  const ids = new Set([...Object.keys(S.marks), ...Object.keys(S.edits), ...S.added.map(r => r._id), ...S.deleted, ...Object.keys(SYNCED)]);
  const rows = [...ids].filter(isDirty).map(rowFor);
  let failed = false;
  if (rows.length){
    setSync('saving');
    for (let i = 0; i < rows.length; i += 400){
      const chunk = rows.slice(i, i + 400);
      const {error} = await sb.from(TABLE).upsert(chunk);
      if (error){ failed = true; break; }
      chunk.forEach(r => SYNCED[r.id] = rowKey(r));
    }
  }
  pushing = false;
  setSync(failed ? 'error' : 'ok');
  clearTimeout(retryTimer);
  if (failed) retryTimer = setTimeout(pushDirty, 15000);
  else if (pushAgain){ pushAgain = false; pushDirty(); }
}
function applyRow(r){
  const id = r.id;
  if (r.status) S.marks[id] = Object.assign(S.marks[id] || {}, {s: r.status});
  else if (S.marks[id]){ delete S.marks[id].s; if (!(S.marks[id].t && S.marks[id].t.length)) delete S.marks[id]; }
  if (r.edits && Object.keys(r.edits).length) S.edits[id] = r.edits; else delete S.edits[id];
  S.added = S.added.filter(a => a._id !== id); if (r.base) S.added.push(r.base);
  S.deleted = S.deleted.filter(x => x !== id); if (r.deleted) S.deleted.push(id);
  SYNCED[id] = rowKey(r);
}
async function pullAll(){
  const all = [];
  for (let from = 0; ; from += 1000){
    const {data, error} = await sb.from(TABLE).select('id,status,edits,base,deleted').range(from, from + 999);
    if (error) throw error;
    all.push(...data); if (data.length < 1000) break;
  }
  return all;
}
async function initSync(){
  if (!sb){ setSync('local'); return; }
  setSync('loading');
  try {
    const rows = await pullAll();
    // work done in this browser before it ever synced (the offline file version) is uploaded once
    const onServer = new Set(rows.map(r => r.id));
    const carry = S.ui.everSynced ? [] : [...new Set([...Object.keys(S.marks), ...Object.keys(S.edits), ...S.added.map(r => r._id), ...S.deleted])]
      .filter(id => !onServer.has(id)).map(rowFor);
    // the server is the source of truth; local cache only covered the gap while loading
    Object.assign(S, {marks:{}, edits:{}, added:[], deleted:[]}); SYNCED = {};
    rows.forEach(applyRow);
    carry.forEach(r => { applyRow(r); delete SYNCED[r.id]; });
    S.ui.everSynced = true;
    loaded = true; rebuild(); renderAll(); if (CUR) renderDrawer(); setSync('ok');
    save();
  } catch(e){ setSync('error'); setTimeout(initSync, 15000); return; }
  sb.channel('negba-biz').on('postgres_changes', {event:'*', schema:'public', table:TABLE}, p => {
    const r = p.new; if (!r || !r.id) return;
    if (isDirty(r.id) || rowKey(r) === rowKey(rowFor(r.id))){ SYNCED[r.id] = rowKey(r); return; }
    applyRow(r); rebuild(); renderSoon();
    const typing = document.activeElement && D.contains(document.activeElement) && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
    if (CUR === r.id && !typing) renderDrawer();
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){}
  }).subscribe();
  // catch up on anything missed while the tab was hidden or offline
  document.addEventListener('visibilitychange', async () => {
    if (document.hidden || !loaded) return;
    try { const rows = await pullAll(); let changed = false;
      for (const r of rows) if (!isDirty(r.id) && rowKey(r) !== rowKey(rowFor(r.id))){ applyRow(r); changed = true; }
      if (changed){ rebuild(); renderAll(); if (CUR) renderDrawer(); }
    } catch(e){}
  });
}

/* undo */
const UNDO = [];
function snapshot(){ return JSON.stringify({marks:S.marks, edits:S.edits, added:S.added, deleted:S.deleted, tags:S.tags}); }
function pushUndo(label){ UNDO.push({label, snap:snapshot()}); if (UNDO.length > 40) UNDO.shift(); $('#undoBtn').disabled = false; $('#undoBtn').title = 'ביטול: ' + label; }
function undo(){
  const u = UNDO.pop(); if (!u) return;
  Object.assign(S, JSON.parse(u.snap));
  $('#undoBtn').disabled = !UNDO.length;
  rebuild(); renderAll(); if (CUR) renderDrawer(); save();
  toast('בוטל: ' + u.label, false);
}

/* ---------------- records ---------------- */
let RECS = [], RIDX = {}, HAY = new Map();
function rebuild(){
  const del = new Set(S.deleted);
  const merge = r => Object.assign({}, r, S.edits[r._id] || {});
  RECS = window.BASE_RECORDS.concat(S.added).filter(r => !del.has(r._id)).map(merge);
  RIDX = Object.fromEntries(RECS.map(r => [r._id, r]));
  HAY.clear();
}
const BASE_IDX = Object.fromEntries(window.BASE_RECORDS.map(r => [r._id, r]));
const baseOf = id => BASE_IDX[id] || S.added.find(r => r._id === id) || {};
const status = id => (S.marks[id] && S.marks[id].s) || 'none';

function isEmpty(v){ return v === undefined || v === null || v === '' || v === false || (Array.isArray(v) && !v.length); }
function vals(r, k){
  switch(k){
    case '__status': { const s = status(r._id); return [s === 'none' ? NONE_LABEL : S_LABEL[s]]; }
    case '__contact': { const c = CONTACT.filter(([, fn]) => fn(r)).map(([l]) => l); return c.length ? c : [EMPTY]; }
    case '__subtype': { const a = [].concat(...SUBTYPE_KEYS.map(k => r[k] || [])); return a.length ? [...new Set(a)] : [EMPTY]; }
  }
  const f = FBY[k], v = r[k];
  if (!f) return [EMPTY];
  if (f.type === 'bool') return [v ? 'כן' : 'לא'];
  if (Array.isArray(v)) return v.length ? v : [EMPTY];
  if (isEmpty(v)) return [EMPTY];
  return [String(v)];
}
function hay(r){
  let h = HAY.get(r._id);
  if (!h){
    h = FIELDS.map(f => { const v = r[f.key]; return Array.isArray(v) ? v.join(' ') : (typeof v === 'string' ? v : ''); }).join(' | ').toLowerCase();
    HAY.set(r._id, h);
  }
  return h;
}

/* ---------------- filtering ---------------- */
function passes(r, skip){
  if (FL.q){
    const h = hay(r);
    for (const w of FL.q.toLowerCase().split(/\s+/)) if (w && !h.includes(w)) return false;
  }
  for (const k in FL.f){
    if (k === skip) continue;
    const c = FL.f[k]; if (!c.v.length) continue;
    const vs = vals(r, k);
    if (c.m === 'all'){ if (!c.v.every(x => vs.includes(x))) return false; }
    else if (c.m === 'none'){ if (c.v.some(x => vs.includes(x))) return false; }
    else if (!c.v.some(x => vs.includes(x))) return false;
  }
  for (const k in FL.r){
    if (k === skip) continue;
    const {min, max} = FL.r[k];
    if (min == null && max == null) continue;
    const n = parseFloat(r[k]);
    if (isNaN(n) || (min != null && n < min) || (max != null && n > max)) return false;
  }
  return true;
}
const filtered = () => RECS.filter(r => passes(r));
function sorted(list){
  const {k, dir} = S.ui.sort;
  const f = fdef(k);
  const key = r => {
    if (k === '__status') return ['yes','maybe','none','no'].indexOf(status(r._id));
    if (f && f.type === 'num'){ const n = parseFloat(r[k]); return isNaN(n) ? -Infinity : n; }
    const v = vals(r, k)[0]; return v === EMPTY ? '￿' : v;
  };
  return list.map(r => [key(r), r]).sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0) * dir).map(x => x[1]);
}
function setFacet(k, values, mode){
  if (!values.length) delete FL.f[k];
  else FL.f[k] = {v: values, m: mode || (FL.f[k] && FL.f[k].m) || 'any'};
  changed();
}
function toggleFacetVal(k, v){
  const cur = FL.f[k] ? FL.f[k].v.slice() : [];
  const i = cur.indexOf(v); i >= 0 ? cur.splice(i, 1) : cur.push(v);
  setFacet(k, cur);
}
function clearFilters(){ FL.q = ''; FL.f = {}; FL.r = {}; $('#q').value = ''; changed(); }
function changed(){ S.ui.filters = FL; save(); renderAll(); }

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent, dec = decodeURIComponent;
const uid = () => Math.random().toString(36).slice(2, 9);
function countBy(list, k){
  const m = new Map();
  for (const r of list) for (const v of vals(r, k)) m.set(v, (m.get(v) || 0) + 1);
  return m;
}
function statusMix(list, k){
  const m = new Map();
  for (const r of list){ const s = status(r._id);
    for (const v of vals(r, k)){ let o = m.get(v); if (!o){ o = {yes:0,maybe:0,no:0,none:0,total:0,ids:[]}; m.set(v, o); } o[s]++; o.total++; o.ids.push(r._id); } }
  return m;
}
function sortEntries(k, entries){
  if (k === '__status'){ const order = [...STATUS.map(s => s.label), NONE_LABEL]; return entries.sort((a,b) => order.indexOf(a[0]) - order.indexOf(b[0])); }
  return entries.sort((a, b) => (a[0] === EMPTY) - (b[0] === EMPTY) || (b[1].total ?? b[1]) - (a[1].total ?? a[1]) || String(a[0]).localeCompare(b[0], 'he'));
}
function facetKeys(){
  const has = k => k.startsWith('__') || RECS.some(r => !isEmpty(r[k]));
  const main = FACET_MAIN.filter(k => fdef(k) && has(k));

/* ---------------- editing ---------------- */
function setField(id, k, v){

  const e = S.edits[id] || (S.edits[id] = {});
  if (same) delete e[k]; else e[k] = v;
  if (!Object.keys(e).length) delete S.edits[id];
  const r = RIDX[id]; if (r){ const merged = Object.assign({}, baseOf(id), S.edits[id] || {}); Object.keys(r).forEach(x => delete r[x]); Object.assign(r, merged); }

    if (k === '__status') for (const l of [...STATUS.map(s => s.label), NONE_LABEL]) if (!counts.has(l)) counts.set(l, 0);
    let entries = sortEntries(k, [...counts.entries()]);
    const fixed = k === '__status';
    if (!fixed) entries = entries.filter(([v, n]) => n > 0 || sel.includes(v));
    const LIMIT = 10, showAll = facetAll[k] || entries.length <= LIMIT + 2;

const href = u => /^https?:\/\//i.test(u) ? u : 'https://' + u;

/* ---------------- drawer ---------------- */

  if (box && e.key === 'Enter'){ e.preventDefault(); if (e.target.value.trim()) addMulti(box, e.target); }
});
function addMulti(box, inp){
  const k = dec(box.dataset.multi), v = inp.value.trim(); inp.value = '';
  const arr = (RIDX[CUR][k] || []).slice(); if (arr.includes(v)) return;
  pushUndo('עריכת ' + label(k)); arr.push(v); setField(CUR, k, arr); refreshField(k, true);
}
D.addEventListener('input', e => {
  const t = e.target; if (!t.dataset.k || t.type === 'checkbox') return;
  const k = dec(t.dataset.k), f = FBY[k];
  beginEdit(k);
  let v = t.value; if (f.type === 'num' && v !== '') v = +v;
  setField(CUR, k, f.type === 'num' ? v : v.trim() === '' ? '' : v);
  const fld = t.closest('.fld'), edited = S.edits[CUR] && k in S.edits[CUR];
  fld.classList.toggle('edited', !!edited);
  if (k === NAME) D.querySelector('h2').textContent = v;
});
function refreshField(k, focus){
  const box = D.querySelector(`[data-k="${enc(k)}"], [data-multi="${enc(k)}"]`); if (!box) return;
  const fld = box.closest('.fld'); fld.outerHTML = fieldHTML(RIDX[CUR], FBY[k]);
  if (focus){ const n = D.querySelector(`[data-multi="${enc(k)}"] input`); n && n.focus(); }
}
function drawerStatus(s){
  const id = CUR;
  setStatus([id], s === 'clear' ? 'clear' : (status(id) === s ? 'clear' : s), true);
  if (S.ui.autoAdvance && s !== 'clear'){
    // the current record may have dropped out of the filtered list – use the saved context
    const i = CTX.indexOf(id); const n = CTX[i + 1]; if (n) setTimeout(() => { CUR = n; renderDrawer(); highlightCur(); }, 120);
  }
}

/* ---------------- popovers / modals ---------------- */
let POP = null;
function closePop(){ if (POP){ POP.remove(); POP = null; } }
function popAt(anchor, html){
  closePop();
  const p = document.createElement('div'); p.className = 'pop'; p.innerHTML = html; document.body.appendChild(p);
  const b = anchor.getBoundingClientRect();
  p.style.top = Math.min(b.bottom + 4, innerHeight - p.offsetHeight - 8) + 'px';
  p.style.left = Math.max(8, Math.min(b.right - p.offsetWidth, innerWidth - p.offsetWidth - 8)) + 'px';
  POP = p; setTimeout(() => document.addEventListener('mousedown', outside), 0);
  function outside(e){ if (!p.contains(e.target)){ closePop(); document.removeEventListener('mousedown', outside); } }
  return p;
}
function modal(html){
  const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(bg); bg.addEventListener('mousedown', e => { if (e.target === bg) bg.remove(); });
  return bg;
}
function colsPopover(anchor){
  const keys = ['__status','__subtype','__contact', ...FIELDS.map(f => f.key).filter(k => k !== NAME)];
  const p = popAt(anchor, `<h5>עמודות בטבלה</h5>${keys.map(k => `<label class="it"><input type="checkbox" data-c="${enc(k)}" ${S.ui.cols.includes(k) ? 'checked' : ''}>${esc(label(k))}</label>`).join('')}`);
  p.addEventListener('change', e => { const k = dec(e.target.dataset.c); S.ui.cols = e.target.checked ? [...S.ui.cols, k] : S.ui.cols.filter(x => x !== k); save(); renderAll(); });
}
function bulkEditPopover(anchor){
  const editable = FIELDS.filter(f => ['single','multi','bool','text'].includes(f.type) && f.key !== NAME);
  const p = popAt(anchor, `<h5>עדכון שדה ל-${SEL.size} עסקים</h5>
    <select id="beF" style="width:100%">${editable.map((f, i) => `<option value="${i}">${esc(f.label)} (${f.group})</option>`).join('')}</select>
    <select id="beM" style="width:100%;margin-top:6px"></select>
    <input type="text" id="beV" list="beL" placeholder="ערך"><datalist id="beL"></datalist>
    <div style="margin-top:8px;text-align:left"><button class="btn sm primary" id="beGo">החל</button></div>`);
  const sync = () => {
    const f = editable[$('#beF').value];
    $('#beM').innerHTML = f.type === 'multi' ? '<option value="add">הוספת ערך</option><option value="remove">הסרת ערך</option><option value="set">החלפה בערך הזה בלבד</option>'
      : f.type === 'bool' ? '<option value="true">סימון ✓</option><option value="false">ביטול סימון</option>' : '<option value="set">קביעת ערך</option><option value="clear">ריקון השדה</option>';
    $('#beV').style.display = f.type === 'bool' ? 'none' : '';
    $('#beL').innerHTML = optionsFor(f.key).map(o => `<option value="${esc(o)}">`).join('');
  };
  sync(); $('#beF').addEventListener('change', sync);
  $('#beGo').addEventListener('click', () => {
    const f = editable[$('#beF').value], m = $('#beM').value, v = $('#beV').value.trim();
    if (f.type !== 'bool' && m !== 'clear' && !v) return;
    pushUndo(`עדכון "${f.label}" ל-${SEL.size} עסקים`);
    for (const id of SEL){
      const r = RIDX[id]; if (!r) continue; let nv;
      if (f.type === 'multi'){ const a = (r[f.key] || []).slice(); nv = m === 'set' ? [v] : m === 'remove' ? a.filter(x => x !== v) : (a.includes(v) ? a : [...a, v]); }
      else if (f.type === 'bool') nv = m === 'true';
      else nv = m === 'clear' ? '' : v;
      setField(id, f.key, nv);
    }
    closePop(); renderAll(); if (CUR) renderDrawer(); toast(`"${f.label}" עודכן ל-${SEL.size} עסקים`);
  });
}
function menuPopover(anchor){
  const p = popAt(anchor, `
    <div class="it" data-a="csv">⬇ ייצוא הרשימה המסוננת ל-CSV (Excel)</div>
    <div class="it" data-a="xlsx">⬇ ייצוא ל-Excel – גיליון לכל ${esc(label(S.ui.groupDim))}</div>
    <div class="it" data-a="xlsxAll">⬇ ייצוא כל העסקים (כולל לא רלוונטיים) ל-Excel</div>

    <div class="it" data-a="backup">💾 גיבוי (קובץ JSON עם כל הסימונים והעריכות)</div>
    <div class="it" data-a="restore">📂 שחזור מגיבוי</div>
    <hr style="border:0;border-top:1px solid var(--line)">
    <div class="it" data-a="reset" style="color:var(--no)">איפוס כל הסימונים והעריכות (לכולם)</div>`);
  p.addEventListener('click', e => {
    const a = (e.target.closest('[data-a]') || {}).dataset?.a; if (!a) return; closePop();
    if (a === 'csv') exportCSV(sorted(filtered()), 'עסקים-מסוננים');
    if (a === 'xlsx') exportXLSX(sorted(filtered()), S.ui.groupDim);
    if (a === 'xlsxAll') exportXLSX(sorted(RECS), null, 'כל-העסקים');
    if (a === 'backup') download(`גיבוי-סינון-עסקים-${today()}.json`, JSON.stringify({app:'negba-tourism', version:1, savedAt:new Date().toISOString(), state:{...S, ui:S.ui}}, null, 1), 'application/json');
    if (a === 'restore') $('#restoreFile').click();
    if (a === 'reset' && confirm('לאפס את כל הסימונים והעריכות לכל המשתמשים? מומלץ לבצע גיבוי קודם.')){ pushUndo('איפוס'); Object.assign(S, {marks:{}, edits:{}, added:[], deleted:[], tags:[]}); rebuild(); save(); renderAll(); }
  });
}
$('#restoreFile').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  try { const j = JSON.parse(await file.text()); const st = j.state || j; if (!st.marks) throw 0;
    if (!confirm(`לשחזר מגיבוי מ-${j.savedAt ? new Date(j.savedAt).toLocaleString('he-IL') : 'קובץ'}? המצב הנוכחי יוחלף.`)) return;
    pushUndo('שחזור מגיבוי'); Object.assign(S, {marks:st.marks, edits:st.edits || {}, added:st.added || [], deleted:st.deleted || [], tags:st.tags || [], views:st.views || S.views});
    rebuild(); save(); renderAll(); toast('הגיבוי שוחזר', false);
  } catch(err){ alert('הקובץ אינו גיבוי תקין'); }
  e.target.value = '';
});

/* ---------------- export ---------------- */
const today = () => new Date().toISOString().slice(0, 10);
function rowObj(r){
  const o = {'סטטוס': status(r._id) === 'none' ? '' : S_LABEL[status(r._id)]};
  for (const f of FIELDS){ const v = r[f.key]; o[f.key] = Array.isArray(v) ? v.join(', ') : f.type === 'bool' ? (v ? 'כן' : '') : (v ?? ''); }
  return o;
}
function download(name, content, type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], {type})); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportCSV(list, name){
  const rows = list.map(rowObj); if (!rows.length) return toast('אין מה לייצא', false);
  const cols = Object.keys(rows[0]);
  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  download(`${name}-${today()}.csv`, '﻿' + [cols.map(q).join(','), ...rows.map(r => cols.map(c => q(r[c])).join(','))].join('\r\n'), 'text/csv;charset=utf-8');
}
function exportXLSX(list, groupKey, name){
  if (!window.XLSX){ toast('ספריית Excel לא נטענה (אין אינטרנט?) – מייצא CSV', false); return exportCSV(list, name || 'עסקים'); }
  const wb = XLSX.utils.book_new(); const used = new Set();
  const sheet = (rows, title) => {
    let n = String(title).replace(/[\[\]:*?\/\\]/g, ' ').slice(0, 28).trim() || 'גיליון'; let base = n, i = 2;
    while (used.has(n)) n = base.slice(0, 25) + ' ' + i++;
    used.add(n); const ws = XLSX.utils.json_to_sheet(rows); ws['!cols'] = Object.keys(rows[0] || {}).map(k => ({wch: k === NAME ? 30 : 16}));
    if (!wb.Workbook) wb.Workbook = {Views:[{RTL:true}]};
    XLSX.utils.book_append_sheet(wb, ws, n);
  };
  sheet(list.map(rowObj), 'הכל');
  if (groupKey){
    const g = sortEntries(groupKey, [...statusMix(list, groupKey).entries()]);
    for (const [v, o] of g) sheet(o.ids.map(id => rowObj(RIDX[id])), v);
    const summary = g.map(([v, o]) => ({[label(groupKey)]: v, 'סה"כ': o.total, 'רלוונטי': o.yes, 'לבדיקה': o.maybe, 'לא רלוונטי': o.no, 'לא סומן': o.none}));
    const ws = XLSX.utils.json_to_sheet(summary); XLSX.utils.book_append_sheet(wb, ws, 'סיכום'); wb.SheetNames.unshift(wb.SheetNames.pop());
  }
  XLSX.writeFile(wb, `${name || 'עסקים-לפי-' + label(groupKey).slice(0, 20)}-${today()}.xlsx`);
}

/* ---------------- dashboard ---------------- */
function stackBar(o){
  return ['yes','maybe','no','none'].filter(s => o[s]).map(s => `<span style="flex:${o[s]};background:${S_COLOR[s]}" title="${s === 'none' ? NONE_LABEL : S_LABEL[s]}: ${o[s]}"></span>`).join('');
}
const LEGEND = `<div class="legend">${[...STATUS.map(s => [s.k, s.label]), ['none', NONE_LABEL]].map(([k, l]) => `<span><i style="background:${S_COLOR[k]}"></i>${l}</span>`).join('')}</div>`;
function renderDash(list){
  const st = {yes:0, maybe:0, no:0, none:0}; list.forEach(r => st[status(r._id)]++);
  const dims = S.ui.dashDims.filter(k => fdef(k));
  const kpi = (k, l, v, c) => `<div class="kpi" data-kpi="${k}"><div class="k">${c ? `<i style="background:${c}"></i>` : ''}${l}</div><div class="v">${v}</div></div>`;
  let h = `<div class="dash">
    <div class="kpis">${kpi('', 'עסקים בסינון הנוכחי', list.length)}${STATUS.map(s => kpi(s.k, s.label, st[s.k], S_COLOR[s.k])).join('')}${kpi('none', NONE_LABEL, st.none, S_COLOR.none)}</div>
    <div class="prog">${stackBar(st)}</div>
    <div class="secth"><h2>פילוח לפי נושאים</h2>${LEGEND}<span class="spacer"></span><button class="btn sm" id="dimsBtn">בחירת נושאים ▾</button></div>
    <div class="cards">`;
  for (const k of dims){
    const mix = sortEntries(k, [...statusMix(list, k).entries()]);
    const max = Math.max(1, ...mix.map(([, o]) => o.total));
    const LIM = 12;
    h += `<div class="card" data-k="${enc(k)}"><h3>${esc(label(k))} <small>${mix.filter(([v]) => v !== EMPTY).length} ערכים</small><button class="x" data-rmdim="1" title="הסרה">✕</button></h3>
      ${mix.slice(0, LIM).map(([v, o]) => `<div class="bar" data-v="${enc(v)}" title="${esc(v)} – לחצו לסינון"><span class="l">${esc(v)}</span><span class="t" style="width:${o.total / max * 100}%">${stackBar(o)}</span><span class="n">${o.total}</span></div>`).join('')}
      ${mix.length > LIM ? `<div style="color:var(--faint);font-size:12px;padding:4px">ועוד ${mix.length - LIM} ערכים… (ראו "רשימות לפי נושא")</div>` : ''}
      ${!mix.length ? '<div style="color:var(--faint)">אין נתונים</div>' : ''}</div>`;
  }
  h += `</div>`;
  // cross tab
  const opts = sel => dimKeys().map(k => `<option value="${enc(k)}" ${k === sel ? 'selected' : ''}>${esc(label(k))}</option>`).join('');
  const A = S.ui.crossA, B = S.ui.crossB;
  const ma = sortEntries(A, [...countBy(list, A).entries()]).slice(0, 40), mb = sortEntries(B, [...countBy(list, B).entries()]).slice(0, 16);
  const grid = {}; let cmax = 1;
  for (const r of list){ const va = vals(r, A), vb = vals(r, B); for (const a of va) for (const b of vb){ const key = a + '\u0000' + b; grid[key] = (grid[key] || 0) + 1; cmax = Math.max(cmax, grid[key]); } }
  h += `<div class="card"><div class="secth" style="margin-bottom:10px"><h2>טבלת הצלבה</h2>
      <select id="crossA">${opts(A)}</select> × <select id="crossB">${opts(B)}</select>
      <button class="btn sm ghost" id="crossSwap" title="החלפה">⇄</button></div>
    <div class="xt"><table><thead><tr><th class="rh">${esc(label(A))} \\ ${esc(label(B))}</th>${mb.map(([b]) => `<th>${esc(b)}</th>`).join('')}<th>סה"כ</th></tr></thead><tbody>
    ${ma.map(([a, na]) => `<tr><td class="rh">${esc(a)}</td>${mb.map(([b]) => { const n = grid[a + '\u0000' + b] || 0;
        return `<td class="c" data-a="${enc(a)}" data-b="${enc(b)}" style="${n ? `background:color-mix(in srgb, var(--accent) ${Math.round(8 + 60 * n / cmax)}%, transparent)` : 'color:var(--faint)'}">${n || '·'}</td>`; }).join('')}<td><b>${na}</b></td></tr>`).join('')}
    </tbody></table></div></div></div>`;
  $('#v-dash').innerHTML = h;
}
function drill(pairs){
  for (const [k, v] of pairs){ FL.f[k] = {v:[v], m:'any'}; S.ui.open[k] = true; }
  switchTab('list'); changed();
}
$('#v-dash').addEventListener('click', e => {
  const t = e.target;
  const kp = t.closest('[data-kpi]'); if (kp){ const k = kp.dataset.kpi; if (k) drill([['__status', k === 'none' ? NONE_LABEL : S_LABEL[k]]]); else switchTab('list'); return; }
  if (t.id === 'dimsBtn'){
    const p = popAt(t, `<h5>נושאים להצגה</h5>${dimKeys().map(k => `<label class="it"><input type="checkbox" data-d="${enc(k)}" ${S.ui.dashDims.includes(k) ? 'checked' : ''}>${esc(label(k))}</label>`).join('')}`);
    p.addEventListener('change', e2 => { const k = dec(e2.target.dataset.d); S.ui.dashDims = e2.target.checked ? [...S.ui.dashDims, k] : S.ui.dashDims.filter(x => x !== k); save(); renderDash(filtered()); });
    return;
  }
  if (t.id === 'crossSwap'){ [S.ui.crossA, S.ui.crossB] = [S.ui.crossB, S.ui.crossA]; save(); renderDash(filtered()); return; }
  const card = t.closest('.card[data-k]');
  if (t.dataset.rmdim && card){ const k = dec(card.dataset.k); S.ui.dashDims = S.ui.dashDims.filter(x => x !== k); save(); renderDash(filtered()); return; }
  const bar = t.closest('.bar'); if (bar && card) return drill([[dec(card.dataset.k), dec(bar.dataset.v)]]);
  const c = t.closest('td.c'); if (c) return drill([[S.ui.crossA, dec(c.dataset.a)], [S.ui.crossB, dec(c.dataset.b)]]);
});
$('#v-dash').addEventListener('change', e => {
  if (e.target.id === 'crossA') S.ui.crossA = dec(e.target.value);
  if (e.target.id === 'crossB') S.ui.crossB = dec(e.target.value);
  save(); renderDash(filtered());
});

/* ---------------- grouped lists ---------------- */

  const k = S.ui.groupDim;

  let h = `<div class="dash"><div class="secth"><h2>רשימות לפי</h2><select id="gDim">${opts}</select>

  }
  h += `</div></div>`;
  $('#v-groups').innerHTML = h;
}
$('#v-groups').addEventListener('change', e => { if (e.target.id === 'gDim'){ S.ui.groupDim = dec(e.target.value); save(); renderGroups(filtered()); } });

$('#sideToggle').addEventListener('click', () => $('#side').classList.toggle('on'));
$('#addBtn').addEventListener('click', () => {
  pushUndo('הוספת עסק'); const r = {_id: 'n' + Date.now().toString(36), [NAME]: 'עסק חדש'}; S.added.push(r); rebuild(); save();
  switchTab('list'); openDrawer(r._id, [r._id]); setTimeout(() => { const i = D.querySelector(`[data-k="${enc(NAME)}"]`); i && (i.focus(), i.select()); }, 200);
});
$('#bulk').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.bulk) return setStatus(SEL, b.dataset.bulk);
  if (b.id === 'bulkClear'){ SEL.clear(); renderAll(); }
  if (b.id === 'bulkEdit') bulkEditPopover(b);
  if (b.id === 'bulkExport') exportCSV([...SEL].map(id => RIDX[id]).filter(Boolean), 'עסקים-נבחרים');
});
document.addEventListener('keydown', e => {
  const inField = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !inField){ e.preventDefault(); undo(); return; }
  if (e.key === 'Escape'){ if (POP) closePop(); else if (document.querySelector('.modal-bg')) document.querySelector('.modal-bg').remove(); else if (CUR) closeDrawer(); else if (SEL.size){ SEL.clear(); renderAll(); } return; }
  if (inField) return;
  if (e.key === '/'){ e.preventDefault(); $('#q').focus(); return; }
  if (!CUR) return;
  const s = STATUS.find(x => x.key === e.key);
  if (s){ drawerStatus(s.k); return; }
  if (e.key === '0') return drawerStatus('clear');
  if (e.key === 'ArrowDown' || e.key === 'j'){ e.preventDefault(); step(1); }
  if (e.key === 'ArrowUp' || e.key === 'k'){ e.preventDefault(); step(-1); }
});

/* ---------------- boot ---------------- */
rebuild();
$('#q').value = FL.q || '';
switchTab(S.ui.tab || 'list');
initSync();
</script>
</body>
</html>
